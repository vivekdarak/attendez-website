<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendez Email Signature</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f7fbfe;
        font-family: Arial, Helvetica, sans-serif;
      }

      .preview-wrap {
        max-width: 680px;
      }

      @media only screen and (max-width: 480px) {
        .signature-shell {
          width: 100% !important;
        }

        .photo-cell,
        .details-cell {
          display: block !important;
          width: 100% !important;
        }

        .photo-cell {
          padding: 0 0 14px 0 !important;
        }

        .divider-cell {
          display: none !important;
        }

        .details-cell {
          padding-left: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-wrap">
      <!-- Images are served from attendez.in so Gmail and other clients can load them reliably. -->
      <table
        class="signature-shell"
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="560"
        style="width: 560px; max-width: 100%; border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; color: #040f22; background: #ffffff;"
      >
        <tr>
          <td style="padding: 18px 20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse;">
              <tr>
                <td class="photo-cell" width="112" valign="top" style="width: 112px; padding: 0 18px 0 0;">
                  <img
                    src="https://attendez.in/email-signature-reference/vivek-darak-headshot-256.jpg"
                    width="96"
                    height="96"
                    alt="Vivek Darak"
                    style="display: block; width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #cef3fa;"
                  >
                                  <div style="width: 102px; padding-top: 8px; font-size: 12px; line-height: 16px; font-weight: 700; color: #0099b6; text-transform: uppercase; letter-spacing: 1.2px; text-align: center;">
                    Founder
                  </div>
                </td>
                <td class="divider-cell" width="1" style="width: 1px; background: #d4dee7; font-size: 1px; line-height: 1px;">&nbsp;</td>
                <td class="details-cell" valign="top" style="padding: 0 0 0 18px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse;">
                    <tr>
                      <td style="padding: 0 0 10px 0;">
                        <div style="font-size: 22px; line-height: 26px; font-weight: 700; color: #003d91; letter-spacing: 0;">
                          Vivek Darak
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 0 0 12px 0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                          <tr>
                            <td valign="middle" width="22" style="width: 22px; padding: 2px 8px 2px 0; font-size: 14px; line-height: 18px; color: #003d91;">M</td>
                            <td valign="middle" style="padding: 2px 0; font-size: 13px; line-height: 18px; color: #4c596b;">
                              <a href="tel:+918080545047" style="color: #4c596b; text-decoration: none;">+91-8080545047</a>
                            </td>
                          </tr>
                          <tr>
                            <td valign="middle" width="22" style="width: 22px; padding: 2px 8px 2px 0; font-size: 14px; line-height: 18px; color: #003d91;">W</td>
                            <td valign="middle" style="padding: 2px 0; font-size: 13px; line-height: 18px; color: #4c596b;">
                              <a href="https://attendez.in" style="color: #003d91; text-decoration: none; font-weight: 700;">attendez.in</a>
                            </td>
                          </tr>
                          <tr>
                            <td valign="middle" width="22" style="width: 22px; padding: 2px 8px 2px 0; font-size: 14px; line-height: 18px; color: #003d91;">A</td>
                            <td valign="middle" style="padding: 2px 0; font-size: 13px; line-height: 18px; color: #4c596b;">
                              Mumbai, India
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 10px 0 0 0; border-top: 1px solid #e3ecf6;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse;">
                          <tr>
                            <td valign="middle" style="padding: 0;">
                              <img
                                src="https://attendez.in/Attendez-logo.png"
                                width="118"
                                alt="Attendez"
                                style="display: block; width: 118px; max-width: 118px; height: auto; border: 0;"
                              >
                            </td>
                            <td valign="middle" align="right" style="padding: 0; font-size: 12px; line-height: 16px; color: #00355f;">
                              AI solutions for modern businesses
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
